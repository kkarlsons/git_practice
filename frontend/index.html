<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Riga Transit Heatmap</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <aside id="panel">
    <h1>Riga transit heatmap</h1>
    <p class="hint">Tap anywhere in Riga. A heatmap of public-transit travel time will load.</p>

    <label>Grid resolution
      <select id="grid-m">
        <option value="200">200 m (fast)</option>
        <option value="100">100 m</option>
        <option value="50" selected>50 m (default)</option>
        <option value="20">20 m (minutes)</option>
      </select>
    </label>

    <label>Max trip
      <select id="max-min">
        <option value="30">30 min</option>
        <option value="60" selected>60 min</option>
        <option value="90">90 min</option>
        <option value="120">2 h</option>
        <option value="180">3 h</option>
      </select>
    </label>

    <div id="status" class="status idle">Waiting for a click…</div>

    <div class="legend">
      <div class="legend-bar"></div>
      <div class="legend-labels"><span>0</span><span id="legend-max">60 min</span></div>
    </div>
  </aside>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
