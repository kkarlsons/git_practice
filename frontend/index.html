<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Riga Transit Heatmap</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <aside id="panel">
    <h1>Riga transit heatmap</h1>
    <p class="hint">Tap anywhere in Riga. A heatmap of public-transit travel time will load.</p>

    <label>Grid resolution
      <select id="grid-m">
        <option value="200">200 m (fast)</option>
        <option value="100">100 m</option>
        <option value="50" selected>50 m (default)</option>
        <option value="20">20 m (minutes)</option>
      </select>
    </label>

    <label>Max trip
      <select id="max-min">
        <option value="30">30 min</option>
        <option value="60" selected>60 min</option>
        <option value="90">90 min</option>
        <option value="120">2 h</option>
        <option value="180">3 h</option>
      </select>
    </label>

    <div class="row">
      <label>Day
        <select id="dow">
          <option value="1" selected>Mon</option>
          <option value="2">Tue</option>
          <option value="3">Wed</option>
          <option value="4">Thu</option>
          <option value="5">Fri</option>
          <option value="6">Sat</option>
          <option value="0">Sun</option>
        </select>
      </label>
      <label>Time
        <input id="time" type="time" value="08:00">
      </label>
    </div>

    <fieldset>
      <legend>Modes</legend>
      <label class="chk"><input type="checkbox" class="mode" value="BUS" checked> Bus</label>
      <label class="chk"><input type="checkbox" class="mode" value="TROLLEYBUS" checked> Trolleybus</label>
      <label class="chk"><input type="checkbox" class="mode" value="TRAM" checked> Tram</label>
      <label class="chk"><input type="checkbox" class="mode" value="RAIL" checked> Train</label>
    </fieldset>

    <label>Show
      <select id="view">
        <option value="time" selected>Travel time</option>
        <option value="rides">Number of rides</option>
      </select>
    </label>

    <label>Max rides
      <select id="max-rides">
        <option value="" selected>No limit</option>
        <option value="1">1 (direct)</option>
        <option value="2">2 (1 transfer)</option>
        <option value="3">3 (2 transfers)</option>
        <option value="4">4 (3 transfers)</option>
      </select>
    </label>

    <label class="slider-label">
      <span>Max walking</span>
      <span id="walk-label">no limit</span>
      <input id="max-walk" type="range" min="0" max="60" step="1" value="0">
    </label>

    <div id="status" class="status idle">Waiting for a click…</div>

    <div class="legend">
      <div id="legend-bar" class="legend-bar"></div>
      <div class="legend-labels"><span id="legend-min">0</span><span id="legend-max">60 min</span></div>
    </div>
  </aside>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
