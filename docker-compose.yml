services:
  backend:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ./data:/data:ro
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      RIGA_GRID_M: ${RIGA_GRID_M:-50}
      RIGA_MAX_TRIP_MIN: ${RIGA_MAX_TRIP_MIN:-90}
      # JVM auto-reads JAVA_TOOL_OPTIONS; JAVA_OPTS is ignored unless a launcher script passes it.
      JAVA_TOOL_OPTIONS: "-Xmx6g"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "2000:2000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
