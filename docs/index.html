<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Volts">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>Volts · Latvia electricity</title>
</head>
<body>
  <header class="top">
    <div class="title">
      <span class="logo" aria-hidden="true">⚡</span>
      <h1>Volts</h1>
    </div>
    <button id="refresh" class="refresh" aria-label="Refresh">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
    </button>
  </header>

  <div class="segmented" role="tablist">
    <button class="seg active" data-day="today" role="tab" aria-selected="true">Today</button>
    <button class="seg" data-day="tomorrow" role="tab" aria-selected="false">Tomorrow</button>
  </div>

  <main id="app">
    <div id="loading" class="state">
      <div class="spinner"></div>
      <p>Loading prices…</p>
    </div>

    <div id="error" class="state hidden">
      <p class="err-title">Couldn't load prices</p>
      <p id="error-msg" class="err-msg"></p>
      <button id="retry" class="btn">Try again</button>
      <div id="diag" class="diag"></div>
    </div>

    <div id="content" class="hidden">
      <section class="card hero">
        <div class="hero-label" id="hero-label">Right now</div>
        <div class="hero-price">
          <span class="big" id="hero-value">—</span>
          <span class="unit">¢/kWh</span>
        </div>
        <div class="hero-sub" id="hero-sub"></div>
        <div class="stats">
          <div class="stat lo">
            <div class="stat-title">↓ Cheapest</div>
            <div class="stat-value" id="stat-lo">—</div>
            <div class="stat-sub" id="stat-lo-sub"></div>
          </div>
          <div class="stat hi">
            <div class="stat-title">↑ Priciest</div>
            <div class="stat-value" id="stat-hi">—</div>
            <div class="stat-sub" id="stat-hi-sub"></div>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="chart-title">15-minute prices</div>
        <svg id="chart" viewBox="0 0 600 240" preserveAspectRatio="none" role="img" aria-label="Price chart"></svg>
        <div class="legend">
          <span class="dot green"></span> 4 cheapest
          <span class="dot red"></span> 4 priciest
          <span class="dot now"></span> now
        </div>
      </section>

      <section id="list" class="list"></section>

      <p class="updated" id="updated"></p>
    </div>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
