<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e1a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f6ff" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Volts">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://rsms.me/">
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
  <link rel="stylesheet" href="styles.css">
  <title>Volts · Latvia electricity</title>
</head>
<body>
  <div class="bg">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="orb orb-c"></div>
    <div class="grain"></div>
  </div>

  <header class="top">
    <div class="brand">
      <div class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 L3 14 h7 l-1 8 l11 -12 h-7 z"/></svg>
      </div>
      <div class="brand-text">
        <h1>Volts</h1>
        <p class="subtitle">Latvia · 15-minute prices</p>
      </div>
    </div>
    <button id="refresh" class="icon-btn" aria-label="Refresh">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
    </button>
  </header>

  <div class="segmented" role="tablist">
    <div class="seg-thumb" id="seg-thumb"></div>
    <button class="seg active" data-day="today" role="tab" aria-selected="true">Today</button>
    <button class="seg" data-day="tomorrow" role="tab" aria-selected="false">Tomorrow</button>
  </div>

  <main id="app">
    <div id="loading" class="state">
      <div class="spinner"></div>
      <p class="state-title">Loading prices</p>
      <p id="loading-msg" class="state-sub"></p>
    </div>

    <div id="error" class="state hidden">
      <div class="state-icon">!</div>
      <p class="state-title">Couldn't load prices</p>
      <p id="error-msg" class="state-sub"></p>
      <button id="retry" class="btn">Try again</button>
      <div id="diag" class="diag"></div>
    </div>

    <div id="content" class="hidden fade-in">
      <!-- Hero -->
      <section class="hero">
        <div class="hero-top">
          <span class="pill" id="hero-pill">—</span>
          <span class="hero-label" id="hero-label">Right now</span>
        </div>
        <div class="hero-num">
          <span class="hero-value" id="hero-value">—</span>
          <span class="hero-unit">¢/kWh</span>
        </div>
        <div class="hero-meta">
          <span id="hero-sub" class="hero-time">—</span>
          <span id="hero-delta" class="hero-delta"></span>
        </div>
        <svg id="hero-spark" class="hero-spark" viewBox="0 0 340 60" preserveAspectRatio="none" aria-hidden="true"></svg>
      </section>

      <!-- Insight -->
      <section id="insight" class="insight hidden">
        <div class="insight-icon" id="insight-icon">🌙</div>
        <div class="insight-text">
          <div class="insight-title" id="insight-title"></div>
          <div class="insight-sub" id="insight-sub"></div>
        </div>
      </section>

      <!-- Min/Max stat cards -->
      <section class="stats">
        <div class="stat lo">
          <div class="stat-head"><span class="stat-dot"></span> Cheapest</div>
          <div class="stat-value" id="stat-lo">—</div>
          <div class="stat-sub" id="stat-lo-sub"></div>
        </div>
        <div class="stat hi">
          <div class="stat-head"><span class="stat-dot"></span> Priciest</div>
          <div class="stat-value" id="stat-hi">—</div>
          <div class="stat-sub" id="stat-hi-sub"></div>
        </div>
      </section>

      <!-- Chart -->
      <section class="card chart-card">
        <div class="card-head">
          <h3>15-minute bars</h3>
          <div class="legend">
            <span>👑 cheapest</span>
            <span>🔥 priciest</span>
          </div>
        </div>
        <svg id="chart" viewBox="0 0 640 280" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Price chart"></svg>
      </section>

      <!-- List -->
      <section class="card list-card">
        <div class="card-head">
          <h3>Every 15-minute slot</h3>
          <span class="count" id="slot-count"></span>
        </div>
        <div id="list" class="list"></div>
      </section>

      <p class="updated" id="updated"></p>
    </div>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
